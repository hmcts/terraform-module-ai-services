name: "Terraform"

on:
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "terraform"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: hmcts/cnp-azuredevops-libraries
          path: cnp-azuredevops-libraries

      - name: Setup Script
        run: |
          chmod +x cnp-azuredevops-libraries/scripts/tfenv-install-terraform.sh

      - name: Setup Terraform
        run: ./cnp-azuredevops-libraries/scripts/tfenv-install-terraform.sh
        working-directory: ./
        shell: bash

      - name: Terraform Init
        run: terraform init
        working-directory: example

      - name: Terraform validate
        run: terraform validate
        working-directory: example

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform Init (module)
        run: terraform init
        working-directory: ./

      - name: Terraform test
        run: |
          terraform test \
            -filter=tests/conditional_resources_unit_test.tftest.hcl \
            -filter=tests/defaults_unit_test.tftest.hcl \
            -filter=tests/network_unit_test.tftest.hcl \
            -filter=tests/outputs_unit_test.tftest.hcl
        working-directory: ./
